<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Housemaster</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Every card photo comes from here. Opening the connection while the
         bundle is still parsing takes a round trip off the first image. -->
    <link rel="preconnect" href="https://cloud.funda.nl" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- Before any paint, so a stored theme never flashes the wrong one.
         Mirrors ThemeProvider's resolution; the key must match its storageKey. -->
    <script>
      try {
        var t = localStorage.getItem("theme")
        var dark =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
