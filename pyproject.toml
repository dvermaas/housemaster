[project]
name = "housemaster"
version = "0.1.0"
description = "Automated house-listing overviews from funda.nl"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "curl-cffi>=0.16.1",
    "flask>=3.1.3",
    # Windows ships no system time-zone database, so `zoneinfo` cannot resolve
    # "Europe/Amsterdam" without this. Linux and the Alpine image already have
    # one, so the container installs nothing extra -- the runtime surface there
    # is still exactly curl_cffi + flask.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The fallback for when Akamai tightens or the payload shape changes: stealth
# Chromium with a Playwright-compatible API. No shipped code imports it, and it
# pulls ~110 MB (playwright) plus a ~200 MB Chromium binary, so it is opt-in:
#     uv sync --extra browser
# The cloakbrowser MCP server is unaffected either way -- it depends on a
# separate npm package of the same name, not on this one.
browser = ["cloakbrowser>=0.5.8"]

# A real WSGI server, for the container. Werkzeug's is a *development* server
# and says so; behind a Cloudflare tunnel it would still be facing the public
# internet. Kept an extra so the core runtime surface stays curl_cffi + flask:
#     uv sync --extra serve
serve = ["gunicorn>=23.0"]

[project.scripts]
housemaster = "housemaster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/housemaster"]
# The built front end is gitignored (it is `npm run build` output), and hatch
# leaves gitignored files out unless told otherwise.
artifacts = ["src/housemaster/web/dist/"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",   # a typo'd @pytest.mark is an error, not a silent no-op
    "--strict-config",
    "-ra",                # summarise every non-passing outcome
    "--import-mode=importlib",
]
markers = [
    "network: hits funda.nl for real (deselect with '-m \"not network\"')",
]
xfail_strict = true       # an xfail that passes is a failure worth knowing about

[tool.mypy]
# `uv run mypy`. Strict from the start: the code was already annotated, and
# the web API's shapes (`web/api.py`) are only worth having if they are checked.
strict = true
files = ["src", "tests"]
mypy_path = "src"
python_version = "3.14"

[tool.ruff]
line-length = 90
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",      # pyflakes: real errors -- undefined names, unused imports
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "N",      # pep8 naming
    "UP",     # pyupgrade: keep syntax current for the pinned Python
    "B",      # bugbear: likely bugs (mutable defaults, loop-variable capture)
    "A",      # no shadowing builtins
    "C4",     # comprehension clarity
    "SIM",    # simplifiable constructs
    "RET",    # return-flow consistency
    "PTH",    # prefer pathlib over os.path
    "PL",     # pylint subset: too-many-args, magic comparisons
    "TRY",    # exception antipatterns
    "RUF",    # ruff's own checks
    "ARG",    # unused arguments
    "DTZ",    # naive datetimes
    "T20",    # no stray print() outside the CLI
    "S",      # bandit: security antipatterns
]
ignore = [
    "TRY003",   # long messages inline: the alternative is an exception class per message
    "PLR0911",  # a dispatch function with several returns is clearer than nesting
]

[tool.ruff.lint.per-file-ignores]
"src/housemaster/cli.py" = ["T20"]      # the CLI is where printing belongs
"src/housemaster/render.py" = ["E501"]  # f-string tables read worse when wrapped
"tests/*" = [
    "S101",     # assert is the point of a test
    "PLR2004",  # literal comparisons are the assertions
    "ARG001",   # fixtures are often requested for their side effects
]

[tool.ruff.lint.isort]
known-first-party = ["housemaster"]

[tool.ruff.lint.pydocstyle]
convention = "google"
