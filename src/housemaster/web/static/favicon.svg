<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="HouseMaster">
  <!--
    The Plattegrond house: a gable elevation on a ground line, drawn the way
    the floor plans in every listing are. Solid roof, outlined body; the weight
    up top is what keeps it readable at 16 pixels, where a hairline drawing
    would turn to mush.

    Colours are the app's blueprint accent, and follow the viewer's theme the
    same way the page does: deep ink on light, cyanotype on dark.

    (No double hyphens anywhere in here. XML forbids them inside a comment,
    and an invalid favicon fails silently as a broken image.)
  -->
  <style>
    .ink { fill: #29527a; stroke: #29527a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #79a8d8; stroke: #79a8d8; }
    }
  </style>
  <g class="ink" stroke-linejoin="round">
    <path d="M16 2.5 30.5 14 1.5 14Z"/>
    <rect x="7" y="15.5" width="18" height="12" fill="none" stroke-width="3"/>
    <rect x="13.5" y="20" width="5" height="7.5"/>
    <rect x="1.5" y="29" width="29" height="2.5"/>
  </g>
</svg>
